[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agents-store"
version = "0.0.1"
description = "One identity, many lawful projections: minted-ID record store with wrappers, mediators and default-deny writes."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lolaplex" }]
requires-python = ">=3.10"
dependencies = [
  "blake3>=1.0",  # MORe SAIDs (KERI/CESR Blake3-256), agents_store.more.said
]
keywords = ["records", "store", "projections", "caldav", "sqlite", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
]

[project.optional-dependencies]
acceptance = [
  "agents-calendar>=0.2.0",
  "radicale",
  "vobject",
]

[project.urls]
Homepage = "https://github.com/Lolaplex/agents-store"
Repository = "https://github.com/Lolaplex/agents-store"
"Bug Tracker" = "https://github.com/Lolaplex/agents-store/issues"

[project.entry-points."agents_store.wrappers"]
# Extension point: third-party packages register Wrapper factories here.

[project.entry-points."agents_store.capabilities"]
# Extension point: third-party packages register Capability factories here.

[project.entry-points."agents_store.violation_ids"]
# Extension point: domains register DomainViolationId factories here.
# Owning domains register their ids; this package leaves the group empty
# (same pattern as wrappers / capabilities).

[project.entry-points."agents_store.domains"]
more = "agents_store.domains.more:factory"
records = "agents_store.domains.records:factory"

[project.scripts]
agents-store = "agents_store.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agents_store = ["*.sql"]
"agents_store.more" = [
  "*.sql",
  "kernel-proposal.json",
  "profiles/*.json",
  "replay_contract/**",
]
