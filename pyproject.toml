[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agents-store"
version = "0.0.1"
description = "One identity, many lawful projections: minted-ID record store with wrappers, mediators and default-deny writes."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lolaplex" }]
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agents_store = ["*.sql"]
