[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agents-store"
version = "0.0.1"
description = "One identity, many lawful projections: minted-ID record store with wrappers, mediators and default-deny writes."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lolaplex" }]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
acceptance = [
  "agents-calendar @ git+https://github.com/Lolaplex/agents-calendar.git",
  "radicale",
  "vobject",
]

[project.entry-points."agents_store.wrappers"]
# Extension point: third-party packages register Wrapper factories here.

[project.entry-points."agents_store.capabilities"]
# Extension point: third-party packages register Capability factories here.

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agents_store = ["*.sql"]
