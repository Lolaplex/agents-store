[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "radicale-agents-store"
version = "0.1.0"
description = "Radicale storage plugin projecting the agents-store canonical layer to CalDAV"
license = { text = "GPL-3.0-only" }
requires-python = ">=3.11"
dependencies = [
    "radicale==3.8.1",
    "agents-store",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["radicale_agents_store*"]
